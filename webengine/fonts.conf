<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  BoltOS Web Engine - webengine/fonts.conf (installed as /etc/fonts/local.conf)

  The fonts a page asks for by Windows' names. Arial, Times New Roman,
  Courier New, Verdana, Georgia and the rest are the real ones; these are
  the ones Windows has and Linux can't, mapped onto open fonts made with the
  same widths, so a line breaks where it does on Windows.
-->
<fontconfig>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Selawik</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Variable</family><prefer><family>Selawik</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Variable Text</family><prefer><family>Selawik</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Variable Display</family><prefer><family>Selawik</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Symbol</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="same"><family>Consolas</family><prefer><family>Cascadia Mono</family></prefer></alias>
  <alias binding="same"><family>Lucida Console</family><prefer><family>Cascadia Mono</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Cambria</family><prefer><family>Caladea</family></prefer></alias>
  <!-- Windows' own font substitutes (HKLM\...\FontSubstitutes) -->
  <alias binding="same"><family>Helvetica</family><prefer><family>Arial</family></prefer></alias>
  <alias binding="same"><family>Times</family><prefer><family>Times New Roman</family></prefer></alias>
  <alias binding="same"><family>Courier</family><prefer><family>Courier New</family></prefer></alias>

  <!-- Debian's own fallback face; Windows has nothing like it, and pages that
       fall back should land on Arial or Times New Roman as they do there. -->
  <selectfont><rejectfont>
    <glob>/usr/share/fonts/truetype/dejavu/*</glob>
  </rejectfont></selectfont>

  <!-- Grey antialiasing, lightly hinted: the closest FreeType gets to how
       DirectWrite draws text, and what survives being sent as video. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
