id=localai
name=BoltOS Local AI
version=1.0.0
summary=A chat with a language model that runs on the Pi itself, with web search.
about=Pick a model and it downloads straight from its maker's Hugging Face repository onto the SD card: Qwen3 0.6B, SmolLM2 360M or Qwen2.5 0.5B, all measured at three or more tokens a second on this board. It runs on the Pi's own cores, with no cloud and no account. Questions about today, the news, the weather or prices search the web first through Exa's MCP server, and the answer lists its sources.
needs=Ethernet, 1 GB of RAM, and 390-680 MB on the SD card for a model
